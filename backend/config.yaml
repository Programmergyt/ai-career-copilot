# AI Career Copilot 配置文件

server:
  host: "8.153.79.69"

llm:
  provider: "deepseek"
  model: "deepseek-chat"
  api_base: "https://api.deepseek.com"
  api_key_env: "DEEPSEEK_API_KEY"
  temperature: 0.3
  max_tokens: 8192
  context_window_tokens: 131072
  token_counter:
    method: "auto"
    chars_per_token: 3.5
    message_overhead_tokens: 4
    provider_overrides:
      anthropic:
        chars_per_token: 3.8
      ollama:
        chars_per_token: 3.6

embedding:
  provider: "dashscope"
  model: "text-embedding-v4"
  api_base: "https://dashscope.aliyuncs.com/api/v1"
  api_key_env: "DASHSCOPE_API_KEY"

rerank:
  provider: "dashscope"
  model: "gte-rerank-v2"
  api_base: "https://dashscope.aliyuncs.com/api/v1"
  api_key_env: "DASHSCOPE_API_KEY"
  top_n: 5

memory:
  enabled: true
  redis_ttl: 86400
  recall_top_k: 8
  recall_cache_ttl: 300
  context_window_tokens: 131072
  context_safety_margin_tokens: 2048
  memory_context_tokens: 24000
  dynamic_summary_tokens: 2000
  min_retrieval_tokens: 2000
  chroma_persist_directory: "data/chroma"
  chroma_collection: "career_memory"

redis:
  host_from: "server"          # 复用 server.host
  port: 6379
  db: 0
  password: ""

mysql:
  host_from: "server"          # 复用 server.host
  port: 3306
  user: "root"
  password_env: "MYSQL_PASSWORD"
  database: "ai_career_copilot"
  charset: "utf8mb4"
  pool_size: 5

langsmith:
  tracing_v2: true
  project: "ai-career-copilot"
  api_key_env: "LANGCHAIN_API_KEY"
  endpoint: "https://api.smith.langchain.com"

fastapi:
  host: "0.0.0.0"
  port: 8000
  debug: true
  workers: 2 # workers默认值，在env中可以覆盖

testing:
  integration:
    run_real_llm_tests: true # 是否使用真实LLM API来进行测试，开启后需要确保环境变量中有正确的API Key


