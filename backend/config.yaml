# AI Career Copilot 配置文件

server:
  host: "8.153.79.69"

llm:
  provider: "deepseek"
  model: "deepseek-chat"
  api_base: "https://api.deepseek.com"
  api_key_env: "DEEPSEEK_API_KEY"
  temperature: 0.3
  max_tokens: 8192

embedding:
  provider: "dashscope"
  model: "text-embedding-v4"
  api_base: "https://dashscope.aliyuncs.com/api/v1"
  api_key_env: "DASHSCOPE_API_KEY"

rerank:
  provider: "dashscope"
  model: "gte-rerank-v2"
  api_base: "https://dashscope.aliyuncs.com/api/v1"
  api_key_env: "DASHSCOPE_API_KEY"
  top_n: 5

redis:
  host_from: "server"          # 复用 server.host
  port: 6379
  db: 0
  password: ""

mysql:
  host_from: "server"          # 复用 server.host
  port: 3306
  user: "root"
  password_env: "MYSQL_PASSWORD"
  database: "ai_career_copilot"
  charset: "utf8mb4"
  pool_size: 5

langsmith:
  tracing_v2: true
  project: "ai-career-copilot"
  api_key_env: "LANGCHAIN_API_KEY"
  endpoint: "https://api.smith.langchain.com"

fastapi:
  host: "0.0.0.0"
  port: 8000
  debug: true
  workers: 2 # workers默认值，在env中可以覆盖

testing:
  integration:
    run_real_llm_tests: true # 是否使用真实LLM API来进行测试，开启后需要确保环境变量中有正确的API Key


